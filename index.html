<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Buddy</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="site-header">
	  <div class="logo-container">
		<img src="images/logo.jpg" alt="Study Buddy logo" class="logo-img" width="100" height="100">
		<h1>Study Buddy</h1>
	  </div>
    <nav class="main-nav" aria-label="Põhinavigatsioon">
		<ul>
		  <li><a href="#intro">Avaleht</a></li>
		  <li><a href="#tips">Nipid</a></li>
		  <li><a href="#forms">Vormid</a></li>
		</ul>
    </nav>
  </header>

  <main>

    <section id="intro" class="section intro-section">
		<div class="container">
		  <h2>Tere tulemast Study Buddy lehele</h2>
		  <p class="intro-text">Siin saad õppimise nippe ja jagada enda omasid.</p>
      <img src="images/study.jpg" alt="Raamatud" class="hero-image">
		</div>
    </section>

    <section id="tips" class="section tips-section">
		<div class="container">
			<h2>Õppimise nipid</h2>
			<ul class="tips-grid">
				<li>Kasuta Pomodoro tehnikat</li>
				<li>Õpi väikeste osadena</li>
				<li>Korda regulaarselt</li>
			</ul>
		</div>
    </section>

    <section id="forms" class="section forms-section">
            <div class="container">
                <h2>Jaga ja liitu</h2>
                <div class="forms-wrapper">
                    <article class="form-card">
                        <h3>Lisa oma õppimisnipp</h3>
                        <form action="#" method="POST" class="study-form">
                            <label for="tip-input">Sinu nipp:</label>
                            <input type="text" id="tip-input" name="tip" placeholder="Nt. Kirjuta märkmeid käsitsi..." required autocomplete="off">
                            <button type="submit">Saada</button>
                        </form>
                    </article>

                    <article class="form-card">
                        <h3>Liitu meiega</h3>
                        <form action="#" method="POST" class="join-form">
                            <label for="name-input">Nimi:</label>
                            <input type="text" id="name-input" name="name" placeholder="Sinu ees- ja perekonnanimi" required>
                            <label for="email-input">Email:</label>
                            <input type="email" id="email-input" name="email" placeholder="nimi@kool.ee" required>
                            <button type="submit">Liitu</button>
                        </form>
                    </article>
                </div>
            </div>
        </section>

  </main>

  <footer class="site-footer">
    <p>© 2026 Study Buddy</p>
  </footer>

</body>
</html>
